name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "logo.png"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy static frontend
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: static
          output_location: ""
          skip_app_build: true

      # Optional: rewrite /ask API calls to the backend App Service
      # Add a staticwebapp.config.json to static/ if needed:
      # {
      #   "routes": [
      #     { "route": "/ask",          "rewrite": "https://zfp-advisor.azurewebsites.net/ask" },
      #     { "route": "/health",       "rewrite": "https://zfp-advisor.azurewebsites.net/health" },
      #     { "route": "/api/messages", "rewrite": "https://zfp-advisor.azurewebsites.net/api/messages" }
      #   ]
      # }
